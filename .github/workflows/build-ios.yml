name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app for iPhone
        run: |
          xcodebuild \
            -project LocalCinema.xcodeproj \
            -scheme LocalCinema \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          ditto build/Build/Products/Release-iphoneos/LocalCinema.app Payload/LocalCinema.app
          zip -qr LocalCinema-unsigned.ipa Payload
          unzip -tq LocalCinema-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: LocalCinema-unsigned-ipa
          path: LocalCinema-unsigned.ipa
          if-no-files-found: error

      - name: Exercise HTTP and authenticated SMB playback in the iPhone simulator
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 18
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          phones = [device for runtime in reversed(list(runtimes.values()))
                    for device in runtime if device["name"].startswith("iPhone")]
          if not phones:
              sys.exit("No available iPhone simulator")
          print(phones[0]["udid"])
          ')
          python3 -m venv "$RUNNER_TEMP/smb-venv"
          "$RUNNER_TEMP/smb-venv/bin/pip" install --quiet impacket==0.13.1
          mkdir -p "$RUNNER_TEMP/smb-share/Danh mục"
          cp UITests/Fixture/surround.mkv "$RUNNER_TEMP/smb-share/Danh mục/"
          python3 -m http.server 8712 --bind 127.0.0.1 --directory UITests/Fixture > "$RUNNER_TEMP/fixture.log" 2>&1 &
          http_pid=$!
          "$RUNNER_TEMP/smb-venv/bin/python" UITests/Fixture/smb_server.py "$RUNNER_TEMP/smb-share" > "$RUNNER_TEMP/smb.log" 2>&1 &
          smb_pid=$!
          trap 'kill "$http_pid" "$smb_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if nc -z 127.0.0.1 1445; then break; fi
            kill -0 "$smb_pid"
            sleep 1
          done
          nc -z 127.0.0.1 1445

          xcodebuild \
            -project LocalCinema.xcodeproj \
            -scheme LocalCinema \
            -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath build \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 \
            -resultBundlePath "$RUNNER_TEMP/LocalCinemaSmoke" \
            test

      - name: Export simulator screenshots
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          if [[ -d "$RUNNER_TEMP/LocalCinemaSmoke.xcresult" ]]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/LocalCinemaSmoke.xcresult" \
              --output-path "$RUNNER_TEMP/LocalCinemaScreenshots"
          fi

      - name: Upload iPhone simulator test report
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: LocalCinema-simulator-report
          path: |
            ${{ runner.temp }}/LocalCinemaSmoke.xcresult
            ${{ runner.temp }}/fixture.log
            ${{ runner.temp }}/smb.log
          if-no-files-found: ignore

      - name: Upload simulator screenshots
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: LocalCinema-simulator-screenshots
          path: ${{ runner.temp }}/LocalCinemaScreenshots
          if-no-files-found: ignore
