name: LocalCinema
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "16.0"
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: "1.0.0"
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2.git
    exactVersion: "4.0.3"
targets:
  LocalCinema:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [Shaders]
      - path: Sources/Shaders
        buildPhase: resources
        type: folder
    dependencies:
      - package: MPVKit
        product: MPVKit
      - package: AMSMB2
        product: AMSMB2
        embed: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Local Cinema
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Kết nối tới máy chủ phim nội bộ (SMB, WebDAV, Jellyfin, Emby, Plex) trong mạng LAN"
        NSBonjourServices:
          - _smb._tcp
          - _webdav._tcp
          - _webdavs._tcp
          - _http._tcp
        NSPhotoLibraryAddUsageDescription: "Lưu ảnh chụp khung hình video vào thư viện Ảnh"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.cinema
        CURRENT_PROJECT_VERSION: 5
        MARKETING_VERSION: "2.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LocalCinemaTests:
    platform: iOS
    type: bundle.unit-test
    sources: Tests
    dependencies:
      - target: LocalCinema
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.local.cinema.tests
  LocalCinemaUITests:
    platform: iOS
    type: bundle.ui-testing
    sources:
      - path: UITests
        excludes: [Fixture]
    dependencies:
      - target: LocalCinema
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.local.cinema.uitests
schemes:
  LocalCinema:
    build:
      targets:
        LocalCinema: all
    test:
      targets:
        - LocalCinemaTests
        - LocalCinemaUITests
