name: LocalCinema
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "16.0"
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: "1.0.0"
targets:
  LocalCinema:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [Shaders]
      - path: Sources/Shaders
        buildPhase: resources
        type: folder
    dependencies:
      - package: MPVKit
        product: MPVKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Local Cinema
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Kết nối tới máy chủ phim nội bộ trong mạng LAN"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.cinema
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: "1.2.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LocalCinemaUITests:
    platform: iOS
    type: bundle.ui-testing
    sources:
      - path: UITests
        excludes: [Fixture]
    dependencies:
      - target: LocalCinema
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.local.cinema.uitests
  LocalCinemaTests:
    platform: iOS
    type: bundle.unit-test
    sources: Tests
    dependencies:
      - target: LocalCinema
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.local.cinema.tests
schemes:
  LocalCinema:
    build:
      targets:
        LocalCinema: all
    test:
      targets:
        - LocalCinemaTests
        - LocalCinemaUITests
