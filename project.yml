name: LocalCinema
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "16.0"
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: "1.0.0"
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2.git
    exactVersion: "4.0.3"
targets:
  LocalCinema:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: MPVKit
        product: MPVKit
      - package: AMSMB2
        product: AMSMB2
        embed: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Local Cinema
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Kết nối tới máy chủ phim nội bộ trong mạng LAN"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.cinema
        CURRENT_PROJECT_VERSION: 4
        MARKETING_VERSION: "1.3.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LocalCinemaUITests:
    platform: iOS
    type: bundle.ui-testing
    sources:
      - path: UITests
        excludes: [Fixture]
    dependencies:
      - target: LocalCinema
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.local.cinema.uitests
schemes:
  LocalCinema:
    build:
      targets:
        LocalCinema: all
    test:
      targets:
        - LocalCinemaUITests
