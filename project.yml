name: LocalCinema
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "16.0"
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: "1.0.0"
targets:
  LocalCinema:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: MPVKit
        product: MPVKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Local Cinema
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Kết nối tới máy chủ phim nội bộ trong mạng LAN"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.cinema
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: "1.1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  LocalCinema:
    build:
      targets:
        LocalCinema: all
